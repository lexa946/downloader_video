name: downloader_test

x-app: &app
  image: downloader_video_test:local
  pull_policy: never
  init: true
  environment:
    DOWNLOAD_FOLDER: /downloads
    FFMPEG_PATH: /usr/bin/ffmpeg
    MIN_VIDEO_HEIGHT: "${TEST_MIN_VIDEO_HEIGHT:-360}"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    REDIS_PREFIX: 'downloader_test:'
    REDIS_TTL: "86400"
    S3_ENDPOINT_URL: http://s3:8333
    S3_PUBLIC_URL: "http://127.0.0.1:${TEST_S3_PORT:-8333}"
    S3_BUCKET_NAME: downloader-test
    S3_ACCESS_KEY: downloader-test
    S3_SECRET_KEY: "${TEST_S3_SECRET_KEY:?set TEST_S3_SECRET_KEY}"
  depends_on:
    redis:
      condition: service_healthy
    s3-init:
      condition: service_completed_successfully
  volumes:
    - downloads:/downloads

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.51
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: downloader-test
      AWS_SECRET_ACCESS_KEY: "${TEST_S3_SECRET_KEY:?set TEST_S3_SECRET_KEY}"
      S3_BUCKET: downloader-test
    ports:
      - "127.0.0.1:${TEST_S3_PORT:-8333}:8333"
    volumes:
      - s3_data:/data

  s3-init:
    image: downloader_video_test:local
    pull_policy: never
    command: ["python", "/docker/init_test_s3.py"]
    environment:
      S3_ENDPOINT: s3:8333
      S3_BUCKET_NAME: downloader-test
      S3_ACCESS_KEY: downloader-test
      S3_SECRET_KEY: "${TEST_S3_SECRET_KEY:?set TEST_S3_SECRET_KEY}"
    depends_on:
      s3:
        condition: service_started

  downloader_video:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${TEST_WEB_PORT:-8085}:80"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1/', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  worker:
    <<: *app
    command: ["python", "-m", "arq", "app.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "python", "-m", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 10s

volumes:
  downloads:
  redis_data:
  s3_data:
