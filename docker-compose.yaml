name: downloader_video_prod

x-app: &app
  image: downloader_video:${IMAGE_TAG:-local}
  pull_policy: never
  init: true
  restart: unless-stopped
  env_file: ${APP_ENV_FILE:-.env.production}
  environment:
    DOWNLOAD_FOLDER: /downloads
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    FORWARDED_ALLOW_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - downloads:/downloads
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  downloader_video:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_BIND_HOST:-0.0.0.0}:${WEB_PORT:-8084}:80"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1/', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "arq", "app.worker.WorkerSettings"]
    scale: 2
    healthcheck:
      test: ["CMD", "python", "-m", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  downloads:
  redis_data:
